# =========================================================================
# Lithnet Resource Management Client build & publish pipeline
# =========================================================================
# Builds the client library and the proxy service, signs the assemblies and
# the proxy executable with the Lithnet EV code-signing certificate, packs
# and signs the NuGet package, builds and signs the MSI installer with
# Advanced Installer, and publishes to the internal Azure Artifacts feed.
#
# After approval, the package is pushed to nuget.org and a GitHub release is
# created with the installer and package attached.
#
# Signing note:
#   The proxy is a Windows service executable that embeds all of its
#   dependency assemblies as resources (see the AfterResolveReferences2
#   target in the proxy csproj), so the .exe is the entire shipped payload.
#   It MUST be signed before Advanced Installer harvests it into the MSI,
#   otherwise the installer delivers an unsigned service binary.
#
# All signing and publishing is delegated to the shared release-tools repo.
# No signing-vault or feed details live in this file.
# =========================================================================

pool:
  vmImage: 'windows-latest'

variables:
  - name: buildPlatform
    value: 'Any CPU'
  - name: buildConfiguration
    value: 'Release'
  - name: build.version.major
    value: 2
  - name: build.version.minor
    value: 0
  - name: build.version.revision
    value: $[counter(format('{0}.{1}', variables['build.version.major'], variables['build.version.minor']), 0)]
  - name: build.version
    value: $(build.version.major).$(build.version.minor).$(build.version.revision)
  - name: build.date
    value: $[format('{0:yyyy}-{0:MM}-{0:dd}T{0:HH}:{0:mm}:{0:ss}', pipeline.startTime)]

  - name: azure.subscription
    value: 'ProductionServices'

  # The lab test environment: VMs tagged environment=testEnvironment in
  # testResourceGroup back the agent pool of the same name. They are
  # deallocated when idle; the pipeline starts and stops them around the
  # test stage. devAzureSubscription is the service connection with rights
  # on that resource group.
  - name: testEnvironment
    value: 'UnitTest1'
  - name: testResourceGroup
    value: 'rg-ams-testhosts'
  - name: devAzureSubscription
    value: 'DevEnvironment'

  - name: tfmProxy
    value: 'net472'

  # The .aip harvests the proxy from this absolute path. Do not change it
  # without also updating the source path in the setup project.
  - name: proxy.build.outputFolder
    value: 'D:\build\rmc\proxy'
  # Advanced Installer resolves the project path through its COM automation
  # host, which does not share the agent's working directory, so the .aip must
  # be passed as an absolute path. It must also use backslashes throughout:
  # Advanced Installer takes the project's base directory from the last
  # backslash in the path, so a mixed-separator path makes it resolve the
  # relative source folder of the APPDIR synchronized folder against the wrong
  # base and the proxy build output is not found.
  - name: setupDir
    value: '$(Build.SourcesDirectory)\src\Lithnet.ResourceManagement.Proxy.Setup'
  - name: nupkgDir
    value: '$(Build.ArtifactStagingDirectory)/cp'
  - name: installerDir
    value: '$(Build.ArtifactStagingDirectory)\installer'

name: $(build.version.major).$(build.version.minor).$(build.version.revision)

# Every push to master builds, signs, and publishes to the internal feed. The
# public nuget.org and GitHub publish stage remains gated by its environment
# approval. Documentation-only changes don't burn a version.
trigger:
  branches:
    include:
    - master
  paths:
    exclude:
    - README.md
    - docs/*

resources:
  repositories:
  - repository: release_tools
    type: git
    name: release-tools/release-tools
    ref: master

stages:
# ── Build, sign, and publish to the internal feed ────────────────────────
- stage: build
  displayName: Build, sign and package
  dependsOn: []
  jobs:
    - job: build_job
      displayName: Build and package
      steps:
        - template: templates/checkout.yaml@release_tools

        - task: NuGetAuthenticate@1
          displayName: Authenticate with NuGet

        # The proxy MUST be built first. The client embeds the proxy executable
        # as a managed resource named Host.exe (see the ProjectReference with
        # OutputItemType=EmbeddedResource in the client csproj), and extracts and
        # executes it at runtime for ConnectionMode.LocalProxy. MSBuild embeds
        # the proxy's build output at client compile time, so the executable has
        # to exist and be signed before the client is compiled. Signing the
        # client assembly afterwards signs only its PE headers, not the resource
        # bytes carried inside it.
        - task: DotNetCoreCLI@2
          displayName: Build Resource Management Proxy
          inputs:
            command: build
            arguments: '-c $(buildConfiguration) -p:Version=$(build.version)'
            projects: 'src/Lithnet.ResourceManagement.Proxy/Lithnet.ResourceManagement.Proxy.csproj'

        # Sign the proxy executable before anything consumes it. Both the bin and
        # obj copies are signed so that no later copy step can replace a signed
        # executable with an unsigned intermediate one.
        - template: templates/codesign.yaml@release_tools
          parameters:
            path:
              - '$(Build.SourcesDirectory)/src/Lithnet.ResourceManagement.Proxy/**/Lithnet.ResourceManagement.Proxy.exe'
            environment: 'prod'
            azureSubscription: '$(azure.subscription)'
            description: 'Lithnet Resource Management Client'

        # BuildProjectReferences=false stops MSBuild rebuilding the proxy as part
        # of the client build, which would overwrite the signed executable with a
        # freshly compiled unsigned one. MSBuild instead resolves the proxy's
        # existing target path and embeds that signed executable as Host.exe.
        - task: DotNetCoreCLI@2
          displayName: Build Resource Management Client
          inputs:
            command: build
            arguments: '-c $(buildConfiguration) -p:Version=$(build.version) -p:GeneratePackageOnBuild=false -p:BuildProjectReferences=false'
            projects: 'src/Lithnet.ResourceManagement.Client/Lithnet.ResourceManagement.Client.csproj'

        - template: templates/codesign.yaml@release_tools
          parameters:
            path:
              - '$(Build.SourcesDirectory)/**/Lithnet.ResourceManagement.Client.dll'
            environment: 'prod'
            azureSubscription: '$(azure.subscription)'
            description: 'Lithnet Resource Management Client'

        # Stage the already-signed proxy for the installer to harvest. --no-build
        # copies the existing signed output rather than recompiling it. The proxy
        # declares TargetFrameworks (plural), so it counts as a cross-targeting
        # project and publish requires the framework to be named explicitly.
        - task: DotNetCoreCLI@2
          displayName: Stage signed proxy for the installer
          inputs:
            command: publish
            arguments: '-c $(buildConfiguration) -f $(tfmProxy) --no-build --output "$(proxy.build.outputFolder)"'
            projects: 'src/Lithnet.ResourceManagement.Proxy/Lithnet.ResourceManagement.Proxy.csproj'
            publishWebProjects: false
            zipAfterPublish: false
            modifyOutputPath: false

        - task: DotNetCoreCLI@2
          displayName: dotnet pack
          inputs:
            command: 'pack'
            packagesToPack: 'src/Lithnet.ResourceManagement.Client/Lithnet.ResourceManagement.Client.csproj'
            packDirectory: '$(nupkgDir)'
            nobuild: true
            includesymbols: true
            versioningScheme: 'byEnvVar'
            versionEnvVar: 'build.version'

        - template: templates/codesign.yaml@release_tools
          parameters:
            path:
              - '$(nupkgDir)/*.nupkg'
              - '$(nupkgDir)/*.snupkg'
            environment: 'prod'
            azureSubscription: '$(azure.subscription)'
            description: 'Lithnet Resource Management Client'

        # Build and sign the MSI. The .aip harvests the already-signed proxy
        # executable from $(proxy.build.outputFolder).
        - template: templates/build-advanced-installer-package.yaml@release_tools
          parameters:
            aipPath: '$(setupDir)\Lithnet.ResourceManagement.Proxy.Setup.aip'
            aipPackageName: 'Lithnet.ResourceManagement.Proxy.Setup.msi'
            azureSubscription: '$(azure.subscription)'
            environment: 'prod'
            outputFolder: '$(installerDir)'
            sign: true

        # Publish to the internal Azure Artifacts feed.
        - template: templates/publish-nuget.yaml@release_tools
          parameters:
            nugetPackagePath: '$(nupkgDir)/*.nupkg'
            symbolPackagePath: '$(nupkgDir)/*.snupkg'
            publishInternal: true
            publishExternal: false

        - task: PublishPipelineArtifact@1
          displayName: Publish nuget artifact
          inputs:
            targetPath: '$(nupkgDir)'
            publishLocation: 'pipeline'
            artifact: cp

        - task: PublishPipelineArtifact@1
          displayName: Publish installer artifact
          inputs:
            targetPath: '$(installerDir)'
            publishLocation: 'pipeline'
            artifact: installer

# ── Start the lab test VM (deallocated when idle) ────────────────────────
- stage: start_test_vms
  displayName: Start lab test VMs
  dependsOn: build
  jobs:
    - template: templates/azure-vm-start.yaml@release_tools
      parameters:
        jobName: start_test_vms
        deployEnvironment: $(testEnvironment)
        distroType: win
        resourceGroup: $(testResourceGroup)
        azureSubscription: $(devAzureSubscription)
        agentMode: pool
        targetPoolName: $(testEnvironment)

# ── Test against the lab MIM service (release gate) ──────────────────────
# Runs the NUnit integration suite and the discovery/SPN unit tests against
# the lab MIM service. The integration suite multi-targets net472, net48,
# net8.0-windows, and net10.0-windows, and parameterises every case across
# the connection modes viable on each runtime (ConnectionModeSources), so a
# plain dotnet test covers the full runtime x transport matrix - the same
# thing Visual Studio runs. The variable group supplies the second-user
# credential the approval tests require - approvals are the most complex
# flow and must be exercised on every gate.
- stage: test
  displayName: Unit tests against lab MIM
  dependsOn: start_test_vms
  variables:
    - group: MIM lab test credentials
  jobs:
    - job: nunit_job
      displayName: Run client test suites
      pool: UnitTest1
      timeoutInMinutes: 120
      steps:
        - checkout: self

        - task: NuGetAuthenticate@1
          displayName: Authenticate with NuGet

        - task: DotNetCoreCLI@2
          displayName: Discovery and SPN unit tests
          inputs:
            command: test
            projects: 'src/Lithnet.ResourceManagement.Client.DiscoveryTests/Lithnet.ResourceManagement.Client.DiscoveryTests.csproj'
            arguments: '-c $(buildConfiguration)'

        - task: DotNetCoreCLI@2
          displayName: Integration tests against lab MIM (all target frameworks)
          condition: succeededOrFailed()
          inputs:
            command: test
            projects: 'src/Lithnet.ResourceManagement.Client.UnitTests/Lithnet.ResourceManagement.Client.UnitTests.csproj'
            arguments: '-c $(buildConfiguration)'
          env:
            UnitTestApprovalUserName: $(LITHNETRMA_TEST_APPROVAL_USER)
            UnitTestApprovalUserDomain: $(LITHNETRMA_TEST_APPROVAL_DOMAIN)
            UnitTestApprovalUserPassword: $(LITHNETRMA_TEST_APPROVAL_PASSWORD)

# ── Deallocate the lab test VM ────────────────────────────────────────────
- stage: stop_test_vms
  displayName: Stop lab test VMs
  dependsOn: test
  condition: always()
  jobs:
    - template: templates/azure-vm-stop.yaml@release_tools
      parameters:
        jobName: stop_test_vms
        deployEnvironment: $(testEnvironment)
        distroType: win
        resourceGroup: $(testResourceGroup)
        azureSubscription: $(devAzureSubscription)

# ── Publish to nuget.org and GitHub (requires approval) ──────────────────
# The GitHub release is sequenced after the nuget.org push, so a failed push
# can never leave a tagged release with no matching package.
- stage: publish_prod
  displayName: Publish to nuget.org and GitHub
  dependsOn: test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
    - deployment: publish_nuget
      displayName: Publish package to public nuget feed
      environment: 'Public nuget feed'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: none

              - download: current
                artifact: cp

              - template: templates/publish-nuget.yaml@release_tools
                parameters:
                  nugetPackagePath: '$(Pipeline.Workspace)/cp/*.nupkg'
                  publishInternal: false
                  publishExternal: true
                  externalFeedCredentials: 'MimManagementAgentsNuget'

    - job: publish_github
      displayName: Publish installer and package to GitHub releases
      dependsOn: publish_nuget
      condition: succeeded()
      steps:
        - checkout: none

        - download: current
          artifact: cp

        - download: current
          artifact: installer

        - task: GitHubRelease@1
          displayName: Create GitHub release (v$(build.version))
          inputs:
            gitHubConnection: github.com_lithnet
            repositoryName: '$(Build.Repository.Name)'
            action: create
            target: '$(Build.SourceVersion)'
            tagSource: userSpecifiedTag
            tag: v$(build.version)
            title: v$(build.version)
            assets: |
              $(Pipeline.Workspace)/installer/*.msi
              $(Pipeline.Workspace)/cp/*.nupkg
            isPreRelease: false
            addChangeLog: true
            changeLogCompareToRelease: lastFullRelease
            changeLogType: commitBased
